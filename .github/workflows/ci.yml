name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install toolchain with mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run task check
        run: task check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install toolchain with mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run task test
        run: task test

  production:
    name: Production safety
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install toolchain with mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production safety tests
        run: task oneput:test:production-safety

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.filter.outputs.browser }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect browser-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            browser:
              - 'packages/safe-html/**'
              - '.github/workflows/**'
              - 'pnpm-lock.yaml'

  browser:
    name: Browser
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install toolchain with mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome channel
        run: pnpm --filter @oneput/safe-html exec playwright install chrome

      - name: Run browser tests
        run: task safe-html:test:browser
